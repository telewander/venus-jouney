customHeaders:
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '/images/**'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: '/sitemap.xml'
    headers:
      - key: Cache-Control
        value: public, max-age=300, must-revalidate
  - pattern: '/robots.txt'
    headers:
      - key: Cache-Control
        value: public, max-age=300, must-revalidate
